[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-collector"
version = "0.5.0"
description = "Corpus collection for linguists and dialect researchers: Alibaba Cloud ASR, keyword search and table export"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "tkinterdnd2>=0.4,<1"]

[project.optional-dependencies]
conversion = ["opencc-python-reimplemented>=0.1.7,<1"]

[project.scripts]
corpus-collector = "corpus_tools.cli:main"

[tool.setuptools]
packages = ["corpus_tools"]
include-package-data = true

[tool.setuptools.package-data]
corpus_tools = ["resources/*.srt", "resources/*.csv"]
